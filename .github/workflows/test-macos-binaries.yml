# TEMPORARY (remove before merge): runs publish.yml's macOS binstall builds on
# this PR to check the runner labels. Publishes nothing.
name: Test macOS binaries

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: binstall ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 linker
        if: matrix.linker == 'aarch64-linux-gnu-gcc'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build gpui-agent
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --target ${{ matrix.target }} -p gpui-agent-cli

      - name: Pack tarball and checksum
        shell: bash
        run: |
          set -euo pipefail
          ver="0.0.0-test"
          target="${{ matrix.target }}"
          name="gpui-agent-cli-${target}-v${ver}.tgz"
          stage="$(mktemp -d)"
          mkdir -p "${stage}/gpui-agent-cli"
          cp "target/${target}/release/gpui-agent" "${stage}/gpui-agent-cli/gpui-agent"
          chmod +x "${stage}/gpui-agent-cli/gpui-agent"
          tar -C "${stage}" -czf "${name}" gpui-agent-cli
          python3 - "${name}" <<'PY'
          import hashlib, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          pathlib.Path(path.name + ".sha256").write_text(f"{digest}  {path.name}\n")
          print(digest, path.name)
          PY
          mkdir -p dist
          mv "${name}" "${name}.sha256" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: binstall-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

