[package]
name = "gpui-agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI and tiny MCP stdio shim for the GPUI agent protocol."

[[bin]]
name = "gpui-agent"
path = "src/main.rs"

[dependencies]
gpui-agent.workspace = true
gpui-agent-recipe.workspace = true
gpui-agent-policy = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = ["instinct"]

# Instinct policy, on by default: `run --goal`, the `locate`/`act` MCP
# tools and the Instinct recipe resolver (deterministic, local, no model
# or network). `--no-default-features` builds the legacy tool set and
# keyword resolver, unchanged.
instinct = ["dep:gpui-agent-policy", "gpui-agent-recipe/instinct"]

# M8: `--escalate jev` — System One fallback via typesafe-sdk. Implies
# instinct; opt-in (no typesafe dep without this feature).
jev = ["instinct", "gpui-agent-policy/jev"]

[dev-dependencies]
todo-core.workspace = true

# cargo-binstall: v* GitHub Release asset
# gpui-agent-cli-<target>-v<version>.tgz contains gpui-agent-cli/gpui-agent
# plus a sibling .sha256 file.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ name }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
[lints]
workspace = true
